on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: Release Flow

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      zvex_release_created: ${{ steps.release.outputs.release_created }}
      zvex_tag_name: ${{ steps.release.outputs.tag_name }}
      zvex_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: "Prepare Release"
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

  precompile:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.zvex_release_created == 'true' }}
    uses: ./.github/workflows/_precompile.yaml
    with:
      ref: ${{ needs.release-please.outputs.zvex_tag_name }}
      tag: ${{ needs.release-please.outputs.zvex_tag_name }}
      version: ${{ needs.release-please.outputs.zvex_version }}
    secrets: inherit

  publish:
    name: Publish to Hex
    needs: [release-please, precompile]
    if: ${{ needs.release-please.outputs.zvex_release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Fetch deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Generate checksum file
        run: mix zigler_precompiled.download Zvex.Native --all --print

      - name: Publish to hex.pm
        run: HEX_API_KEY=${{ secrets.HEX_API_KEY }} mix hex.publish --yes
