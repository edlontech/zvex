on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: Release Flow

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      zvex_release_created: ${{ steps.release.outputs.release_created }}
      zvec_release_created: ${{ steps.release.outputs['.zvec--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: "Prepare Release"
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.zvex_release_created == 'true' }}
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        elixir: ["1.19.4"]
        otp: ["28.3"]
        zig: ["0.15.2"]
    env:
      CMAKE_FLAGS: >-
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DBUILD_C_BINDINGS=ON
        -DBUILD_PYTHON_BINDINGS=OFF
        -DBUILD_TOOLS=OFF
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build essentials
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Resolve submodule SHA
        id: submodule
        shell: bash
        run: echo "sha=$(git -C c_src/zvec rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: publish-${{ runner.os }}-${{ runner.arch }}
          max-size: 1G

      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: _build/zvec
          key: cmake-publish-${{ runner.os }}-${{ runner.arch }}-${{ steps.submodule.outputs.sha }}-${{ hashFiles('c_src/zvec/CMakeLists.txt', 'c_src/zvec/cmake/**') }}
          restore-keys: |
            cmake-publish-${{ runner.os }}-${{ runner.arch }}-${{ steps.submodule.outputs.sha }}-
            cmake-publish-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch and Compile Dependencies
        run: |
          mix deps.get
          mix deps.compile

      - name: Publish to hex.pm
        run: HEX_API_KEY=${{ secrets.HEX_API_KEY }} mix hex.publish --yes
