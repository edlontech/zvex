name: Release binaries

on:
  push:
    tags:
      - "zvec-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-gnu
            runner: ubuntu-24.04
            shared_lib: libzvec_c_api.so
          - target: linux-aarch64-gnu
            runner: ubuntu-22.04-arm
            shared_lib: libzvec_c_api.so
          - target: darwin-aarch64
            runner: macos-14-xlarge
            shared_lib: libzvec_c_api.dylib

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract tag version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#zvec-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve submodule SHA
        id: submodule
        shell: bash
        run: echo "sha=$(git -C c_src/zvec rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sudo apt-get install -y mold || echo "mold not available; falling back to default linker"

      - name: Install build tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}
          max-size: 5G

      - name: Compute build cache key
        id: cache_keys
        shell: bash
        run: |
          echo "primary=cmake-${{ matrix.target }}-${{ steps.submodule.outputs.sha }}-${{ hashFiles('c_src/zvec/CMakeLists.txt', 'c_src/zvec/cmake/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore CMake build directory
        id: cmake_cache
        uses: actions/cache/restore@v4
        with:
          path: _build/zvec
          key: ${{ steps.cache_keys.outputs.primary }}
          restore-keys: |
            cmake-${{ matrix.target }}-${{ steps.submodule.outputs.sha }}-
            cmake-${{ matrix.target }}-

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            jobs=$(nproc)
            if command -v mold >/dev/null 2>&1; then
              extra+=(-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=mold -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=mold)
            fi
          else
            jobs=$(sysctl -n hw.ncpu)
          fi
          cmake -S c_src/zvec -B _build/zvec -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_C_BINDINGS=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TOOLS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            ${extra[@]+"${extra[@]}"}
          cmake --build _build/zvec --config Release --target zvec_c_api -j "$jobs"

      - name: Save CMake build directory
        if: always() && steps.cmake_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: _build/zvec
          key: ${{ steps.cache_keys.outputs.primary }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          staging=priv-staging
          mkdir -p "$staging/lib" "$staging/include/zvec"
          cp _build/zvec/lib/${{ matrix.shared_lib }} "$staging/lib/"
          cp c_src/zvec/src/include/zvec/c_api.h "$staging/include/zvec/"

      - name: Fix macOS install name
        if: startsWith(matrix.runner, 'macos')
        run: install_name_tool -id @rpath/${{ matrix.shared_lib }} priv-staging/lib/${{ matrix.shared_lib }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="zvec-v${{ steps.version.outputs.version }}-${{ matrix.target }}"
          tar -C priv-staging -czf "${name}.tar.gz" lib include
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zvec-${{ matrix.target }}
          path: |
            zvec-v*.tar.gz
            zvec-v*.tar.gz.sha256

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true

  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: publish
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-gnu
            runner: ubuntu-22.04
          - target: linux-aarch64-gnu
            runner: ubuntu-22.04-arm
          - target: darwin-aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Cache hex deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.hex
            ~/.mix
          key: mix-${{ matrix.target }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.target }}-

      - name: Compile with downloaded artifact
        run: |
          mix deps.get
          ok=0
          for i in 1 2 3 4 5; do
            if mix deps.compile; then
              ok=1
              break
            fi
            echo "Retry $i..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "mix deps.compile failed after 5 attempts" >&2
            exit 1
          fi
          mix compile
